<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einbürgerungstest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="masthead">
        <h1>Einbürgerungstest</h1>
        <p class="subtitle" id="subtitleText">Fragenkatalog für Rheinland-Pfalz</p>
    </div>

    <div class="controls-container">
        <div class="navigation-links">
            <a href="test-your-knowledge.html" class="nav-link">Test Your Knowledge</a>
            <a href="test-your-knowledge.html?missed=1" id="reviewMissedLink" class="nav-link">Review Missed (<span id="missedCount">0</span>)</a>
        </div>
        <div class="right-controls">
            <div class="field-group">
                <span class="field-label">Bundesland</span>
                <select id="stateSelect">
                    <option value="">Kein Bundesland (alle Fragen)</option>
                    <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                    <option value="Berlin">Berlin</option>
                </select>
            </div>

            <div class="field-group">
                <span class="field-label">Fragen pro Seite</span>
                <select id="pageSizeSelect">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="1000">Alle</option>
                </select>
            </div>

            <div class="field-group">
                <span class="field-label">Spalten</span>
                <select id="columnsSelect">
                    <option value="1">1 Spalte</option>
                    <option value="2">2 Spalten</option>
                </select>
            </div>

            <button id="randomizeBtn">Randomize Questions</button>

            <div class="theme-switch-wrapper">
                <span class="control-label">Study answers</span>
                <label class="theme-switch">
                    <input type="checkbox" id="studyModeToggle" aria-label="Show all answers">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="theme-switch-wrapper">
                <span class="theme-icon">☀️</span>
                <label class="theme-switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-icon">🌙</span>
            </div>
        </div>
    </div>

    <div id="quizContainer" class="quiz-container">
        <div class="quiz-header">
            <h2>Fragenkatalog</h2>
            <div class="score-container">
                <span id="score">0</span> / <span id="totalQuestions">0</span> richtig
            </div>
        </div>
        
        <div id="questionsContainer"></div>
        
        <div class="navigation">
            <div class="pagination">
                <button id="prevBtn" disabled>Previous</button>
                <div id="paginationContainer"></div>
                <button id="nextBtn" disabled>Next</button>
            </div>
            
            <div class="jump-container">
                <label for="jumpToQuestion">Jump to question:</label>
                <input type="number" id="jumpToQuestion" min="1">
                <button id="jumpBtn">Go</button>
            </div>
        </div>
    </div>
    
    <script src="study-mode.js"></script>
    <script src="missed-questions.js"></script>
    <script>
        let questions = [];
        let currentPage = 1;
        let questionsPerPage = parseInt(localStorage.getItem('questionsPerPage'), 10) || 10;
        let columnCount = parseInt(localStorage.getItem('columnCount'), 10) || 1;
        let score = 0;
        let answeredQuestions = {};
        let isStudyModeEnabled = localStorage.getItem('studyMode') === 'enabled';
        let revealedAnswerIndices = new Set();
        
        // DOM elements
        const quizContainer = document.getElementById('quizContainer');
        const questionsContainer = document.getElementById('questionsContainer');
        const scoreElement = document.getElementById('score');
        const totalQuestionsElement = document.getElementById('totalQuestions');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const paginationContainer = document.getElementById('paginationContainer');
        const jumpToQuestion = document.getElementById('jumpToQuestion');
        const jumpBtn = document.getElementById('jumpBtn');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const themeToggle = document.getElementById('themeToggle');
        const studyModeToggle = document.getElementById('studyModeToggle');
        const missedCountElement = document.getElementById('missedCount');
        const stateSelect = document.getElementById('stateSelect');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const columnsSelect = document.getElementById('columnsSelect');
        const subtitleText = document.getElementById('subtitleText');

        let allQuestions = [];
        const storedState = localStorage.getItem('selectedState');
        let selectedState = storedState !== null ? storedState : 'Rheinland-Pfalz';

        function filterQuestionsByState(questionList, state) {
            if (!state) {
                return questionList;
            }
            return questionList.filter(question => !question.state || question.state === state);
        }

        function updateSubtitle() {
            subtitleText.textContent = selectedState
                ? `Fragenkatalog für ${selectedState}`
                : 'Fragenkatalog, alle Bundesländer';
        }

        function applyColumnLayout() {
            questionsContainer.classList.toggle('columns-2', columnCount === 2);
            document.body.classList.toggle('wide', columnCount === 2);
        }

        // Get saved page from localStorage (if exists)
        const savedPage = localStorage.getItem('currentPage');

        // Event listeners
        prevBtn.addEventListener('click', goToPreviousPage);
        nextBtn.addEventListener('click', goToNextPage);
        jumpBtn.addEventListener('click', jumpToQuestionNumber);
        randomizeBtn.addEventListener('click', randomizeQuestions);
        themeToggle.addEventListener('change', toggleTheme);
        studyModeToggle.addEventListener('change', toggleStudyMode);
        stateSelect.addEventListener('change', (event) => {
            selectedState = event.target.value;
            localStorage.setItem('selectedState', selectedState);
            questions = filterQuestionsByState(allQuestions, selectedState);
            localStorage.setItem('currentPage', 1);
            updateSubtitle();
            initializeQuiz();
        });
        pageSizeSelect.addEventListener('change', (event) => {
            questionsPerPage = parseInt(event.target.value, 10);
            localStorage.setItem('questionsPerPage', questionsPerPage);
            localStorage.setItem('currentPage', 1);
            initializeQuiz();
        });
        columnsSelect.addEventListener('change', (event) => {
            columnCount = parseInt(event.target.value, 10);
            localStorage.setItem('columnCount', columnCount);
            applyColumnLayout();
        });

        stateSelect.value = selectedState;
        pageSizeSelect.value = String(questionsPerPage);
        columnsSelect.value = String(columnCount);
        applyColumnLayout();
        updateSubtitle();
        
        // Check for saved theme preference
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.checked = true;
        }

        studyModeToggle.checked = isStudyModeEnabled;
        
        // Toggle theme function
        function toggleTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleStudyMode(event) {
            isStudyModeEnabled = event.target.checked;
            localStorage.setItem('studyMode', isStudyModeEnabled ? 'enabled' : 'disabled');
            updateStudyAnswerHighlights();
        }

        function updateStudyAnswerHighlights() {
            document.querySelectorAll('.options').forEach((optionsList) => {
                const firstOption = optionsList.querySelector('.option');
                if (!firstOption) {
                    return;
                }

                const questionIndex = Number(firstOption.dataset.questionIndex);
                StudyMode.applyStudyMode(
                    optionsList.querySelectorAll('.option'),
                    questions[questionIndex].correctAnswer,
                    isAnswerVisible(questionIndex)
                );
            });

            document.querySelectorAll('.answer-toggle').forEach((button) => {
                button.disabled = isStudyModeEnabled;
            });
        }

        function isAnswerVisible(questionIndex) {
            return isStudyModeEnabled || revealedAnswerIndices.has(questionIndex);
        }

        function updateMissedCount() {
            missedCountElement.textContent = MissedQuestions.getMissedQuestionCount();
        }

        function toggleAnswerReveal(event) {
            const button = event.currentTarget;
            const questionIndex = Number(button.dataset.questionIndex);

            if (revealedAnswerIndices.has(questionIndex)) {
                revealedAnswerIndices.delete(questionIndex);
                button.textContent = 'Show Answer';
            } else {
                revealedAnswerIndices.add(questionIndex);
                button.textContent = 'Hide Answer';
            }

            const options = document.querySelectorAll(`#question-${questionIndex} .option`);
            StudyMode.applyStudyMode(options, questions[questionIndex].correctAnswer, isAnswerVisible(questionIndex));
        }
        
        // Randomize questions
        function randomizeQuestions() {
            if (questions.length > 0) {
                // Create a copy of questions and shuffle it
                const shuffled = [...questions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                
                // Update questions array with shuffled array
                questions = shuffled;
                
                // Reset state and redisplay
                currentPage = 1;
                score = 0;
                answeredQuestions = {};
                revealedAnswerIndices = new Set();
                scoreElement.textContent = score;

                // Update saved page in localStorage
                localStorage.setItem('currentPage', 1);
                
                // Update UI
                createPagination();
                displayQuestions();
                updateButtonStates();
            }
        }
        
        // Initialize quiz
        function initializeQuiz(restoreSavedPage = false) {
            // Reset quiz state; only the very first load restores the last-viewed page
            currentPage = (restoreSavedPage && savedPage) ? parseInt(savedPage) : 1;
            score = 0;
            answeredQuestions = {};
            
            // Update UI
            quizContainer.style.display = 'block';
            totalQuestionsElement.textContent = questions.length;
            scoreElement.textContent = score;
            
            // Create pagination
            createPagination();
            
            // Display questions
            displayQuestions();
            
            // Update button states
            updateButtonStates();

            updateMissedCount();
        }

        // Create pagination
        function createPagination() {
            paginationContainer.innerHTML = '';
            
            const totalPages = Math.ceil(questions.length / questionsPerPage);
            
            for (let i = 1; i <= totalPages; i++) {
                const pageItem = document.createElement('span');
                pageItem.classList.add('page-item');
                pageItem.textContent = i;
                
                if (i === currentPage) {
                    pageItem.classList.add('active');
                }
                
                pageItem.addEventListener('click', () => {
                    currentPage = i;
                    displayQuestions();
                    updatePagination();
                    updateButtonStates();
                });
                
                paginationContainer.appendChild(pageItem);
            }
        }
        
        // Display questions for current page
        function displayQuestions() {
            questionsContainer.innerHTML = '';
            localStorage.setItem('currentPage', currentPage);
            
            const startIndex = (currentPage - 1) * questionsPerPage;
            const endIndex = Math.min(startIndex + questionsPerPage, questions.length);
            
            for (let i = startIndex; i < endIndex; i++) {
                const question = questions[i];
                
                // Create question container
                const questionContainer = document.createElement('div');
                questionContainer.classList.add('question-container');
                questionContainer.id = `question-${i}`;

                // Reference-number badge, like a field number on an official form
                const questionIdBadge = document.createElement('div');
                questionIdBadge.classList.add('question-id');
                questionIdBadge.textContent = String(question.id).padStart(3, '0');
                questionContainer.appendChild(questionIdBadge);

                const questionBody = document.createElement('div');
                questionBody.classList.add('question-body');

                // Create question text
                const questionElement = document.createElement('div');
                questionElement.classList.add('question');
                questionElement.textContent = question.question;

                questionBody.appendChild(questionElement);

                if (question.img) {
                    // Create question image
                    const questionImage = document.createElement('img');
                    questionImage.src = "imgs/" + question.img;
                    questionBody.appendChild(questionImage);
                }

                // Create translation toggle
                const translationToggle = document.createElement('button');
                translationToggle.classList.add('translation-toggle');
                translationToggle.textContent = 'Show Translation';
                translationToggle.dataset.questionId = i;
                translationToggle.addEventListener('click', toggleTranslation);
                questionBody.appendChild(translationToggle);

                // Create answer toggle
                const answerToggle = document.createElement('button');
                answerToggle.classList.add('answer-toggle');
                answerToggle.textContent = revealedAnswerIndices.has(i) ? 'Hide Answer' : 'Show Answer';
                answerToggle.dataset.questionIndex = i;
                answerToggle.disabled = isStudyModeEnabled;
                answerToggle.addEventListener('click', toggleAnswerReveal);
                questionBody.appendChild(answerToggle);

                // Create question translation
                const translationElement = document.createElement('div');
                translationElement.classList.add('translation');
                translationElement.id = `translation-${i}`;
                translationElement.textContent = question.question_trans;
                questionBody.appendChild(translationElement);

                // Create options
                const optionsList = document.createElement('ul');
                optionsList.classList.add('options');

                question.options.forEach((option, optionIndex) => {
                    const optionItem = document.createElement('li');
                    optionItem.classList.add('option');
                    optionItem.dataset.questionIndex = i;
                    optionItem.dataset.optionIndex = optionIndex;

                    // Ballot-style marker, filled in when this option is chosen
                    const optionMarker = document.createElement('span');
                    optionMarker.classList.add('option-marker');
                    optionItem.appendChild(optionMarker);

                    const optionMark = document.createElement('span');
                    optionMark.classList.add('option-mark');

                    // Create option text container
                    const optionText = document.createElement('span');
                    optionText.textContent = option;
                    optionMark.appendChild(optionText);

                    // Create option translation container
                    const optionTranslation = document.createElement('span');
                    optionTranslation.classList.add('option-translation');
                    optionTranslation.textContent = question.options_trans[optionIndex];
                    optionMark.appendChild(optionTranslation);

                    optionItem.appendChild(optionMark);

                    optionItem.addEventListener('click', selectOption);

                    optionsList.appendChild(optionItem);
                });

                questionBody.appendChild(optionsList);
                questionContainer.appendChild(questionBody);
                StudyMode.applyStudyMode(optionsList.querySelectorAll('.option'), question.correctAnswer, isAnswerVisible(i));
                questionsContainer.appendChild(questionContainer);
            }
        }
        
        // Select an option
        function selectOption(event) {
            const optionItem = event.currentTarget;
            const questionIndex = parseInt(optionItem.dataset.questionIndex);
            const optionIndex = parseInt(optionItem.dataset.optionIndex);
            const question = questions[questionIndex];
            
            // Mark question as answered
            answeredQuestions[questionIndex] = optionIndex;

            // Add selected class
            optionItem.classList.add('selected');

            // Check if answer is correct
            const isCorrect = optionIndex === question.correctAnswer - 1;

            if (isCorrect) {
                optionItem.classList.add('correct');
                score++;
                scoreElement.textContent = score;
            } else {
                optionItem.classList.add('incorrect');

                // Highlight the correct answer
                const optionsList = optionItem.parentElement;
                const correctOption = optionsList.querySelector(`[data-option-index="${question.correctAnswer-1}"]`);
                if (correctOption) {
                    correctOption.classList.add('correct');
                }
            }

            MissedQuestions.recordAnswer(question.id, isCorrect);
            updateMissedCount();

            // Disable click events for all options in this question
            const allOptions = optionItem.parentElement.querySelectorAll('.option');
            allOptions.forEach(option => {
                option.removeEventListener('click', selectOption);
            });
        }
        
        // Toggle translation
        function toggleTranslation(event) {
            const button = event.currentTarget;
            const questionId = button.dataset.questionId;
            const translationElement = document.getElementById(`translation-${questionId}`);
            const optionTranslations = document.querySelectorAll(`.option[data-question-index="${questionId}"] .option-translation`);
            
            if (translationElement.classList.contains('visible')) {
                translationElement.classList.remove('visible');
                optionTranslations.forEach(trans => trans.classList.remove('visible'));
                button.textContent = 'Show Translation';
            } else {
                translationElement.classList.add('visible');
                optionTranslations.forEach(trans => trans.classList.add('visible'));
                button.textContent = 'Hide Translation';
            }
        }
        
        // Go to previous page
        function goToPreviousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayQuestions();
                updatePagination();
                updateButtonStates();
            }
        }
        
        // Go to next page
        function goToNextPage() {
            const totalPages = Math.ceil(questions.length / questionsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayQuestions();
                updatePagination();
                updateButtonStates();
            }
        }
        
        // Jump to specific question
        function jumpToQuestionNumber() {
            const questionNumber = parseInt(jumpToQuestion.value);
            if (questionNumber && questionNumber > 0 && questionNumber <= questions.length) {
                const pageNumber = Math.ceil(questionNumber / questionsPerPage);
                currentPage = pageNumber;
                
                displayQuestions();
                updatePagination();
                updateButtonStates();
                
                // Scroll to the specific question
                const index = questionNumber - 1;
                const questionContainers = document.querySelectorAll('.question-container');
                const containerIndex = index % questionsPerPage;
                
                if (questionContainers[containerIndex]) {
                    questionContainers[containerIndex].scrollIntoView({ behavior: 'smooth' });
                }
            } else {
                alert(`Please enter a valid question number between 1 and ${questions.length}.`);
            }
        }
        
        // Update pagination
        function updatePagination() {
            const pageItems = paginationContainer.querySelectorAll('.page-item');
            pageItems.forEach((item, index) => {
                if (index + 1 === currentPage) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // Update button states
        function updateButtonStates() {
            const totalPages = Math.ceil(questions.length / questionsPerPage);
            
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }
        
        // Quiz class to handle loading questions from JSON file
        class Quiz {
            constructor(data) {
                this.questions = data.questions || [];
            }
            
            static async loadQuestions() {
                try {
                    const response = await fetch('dataset.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error loading questions:', error);
                    quizContainer.innerHTML = `
                        <div class="error">
                            <h2>Error loading questions</h2>
                            <p>Please make sure dataset.json is in the same directory as this HTML file.</p>
                            <p>Error details: ${error.message}</p>
                        </div>
                    `;
                    return { questions: [] };
                }
            }
        }
        
        // Load the quiz data on page load
        document.addEventListener('DOMContentLoaded', async function() {
            const data = await Quiz.loadQuestions();
            allQuestions = data.questions || [];
            questions = filterQuestionsByState(allQuestions, selectedState);
            if (questions.length > 0) {
                initializeQuiz(true);

                // Make sure the saved page is valid (not greater than the total number of pages)
                const totalPages = Math.ceil(questions.length / questionsPerPage);
                if (currentPage > totalPages) {
                    currentPage = totalPages;
                    localStorage.setItem('currentPage', currentPage);
                }
                
                // Load the saved page
                displayQuestions();
                updatePagination();
                updateButtonStates();
            } else if (questions.length === 0 && !document.querySelector('.error')) {
                quizContainer.innerHTML = `
                    <div class="error">
                        <h2>No questions found</h2>
                        <p>The JSON file was loaded but no questions were found.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
