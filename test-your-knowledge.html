<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Your Knowledge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="masthead">
        <h1>Test Your Knowledge</h1>
        <p class="subtitle" id="subtitleText">Übungstest für Rheinland-Pfalz</p>
    </div>

    <div class="controls-container">
        <div class="navigation-links">
            <a href="index.html" class="nav-link">Back to Main Quiz</a>
            <a href="test-your-knowledge.html?missed=1" id="reviewMissedLink" class="nav-link">Review Missed (<span id="missedCount">0</span>)</a>
        </div>
        <div class="right-controls">
            <div class="field-group">
                <span class="field-label">Bundesland</span>
                <select id="stateSelect">
                    <option value="">Kein Bundesland (alle Fragen)</option>
                    <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                    <option value="Baden-Württemberg">Baden-Württemberg</option>
                    <option value="Bayern">Bayern</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Brandenburg">Brandenburg</option>
                    <option value="Bremen">Bremen</option>
                    <option value="Hamburg">Hamburg</option>
                    <option value="Hessen">Hessen</option>
                    <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
                    <option value="Niedersachsen">Niedersachsen</option>
                    <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
                    <option value="Saarland">Saarland</option>
                    <option value="Sachsen">Sachsen</option>
                    <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
                    <option value="Schleswig-Holstein">Schleswig-Holstein</option>
                    <option value="Thüringen">Thüringen</option>
                </select>
            </div>

            <div class="field-group">
                <span class="field-label">Spalten</span>
                <select id="columnsSelect">
                    <option value="1">1 Spalte</option>
                    <option value="2">2 Spalten</option>
                </select>
            </div>

            <button id="restartBtn">New Test</button>

            <div class="theme-switch-wrapper">
                <span class="control-label">Study answers</span>
                <label class="theme-switch">
                    <input type="checkbox" id="studyModeToggle" aria-label="Show all answers">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="theme-switch-wrapper">
                <span class="theme-icon">☀️</span>
                <label class="theme-switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-icon">🌙</span>
            </div>
        </div>
    </div>

    <div id="quizContainer" class="quiz-container">
        <div class="quiz-header">
            <h2 id="quizTitle">33 Random Questions</h2>
            <div class="score-container">
                <span id="score">0</span> / <span id="totalQuestions">33</span> correct
            </div>
        </div>

        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <div id="questionsContainer"></div>
    </div>

    <div id="resultsSection" class="results-section">
        <h2>Test Results</h2>
        <div class="results-score">You scored: <span id="finalScore">0</span> / <span id="finalTotalQuestions">33</span></div>
        <div class="results-message" id="resultsMessage"></div>
        <button id="viewAnswersBtn">View Answers</button>
        <button id="takeNewTestBtn" class="restart-btn">Take New Test</button>
    </div>
    
    <script src="study-mode.js"></script>
    <script src="missed-questions.js"></script>
    <script>
        const QUIZ_SESSION_STORAGE_KEY = 'quizSession';

        let questions = [];
        let selectedQuestions = [];
        let score = 0;
        let answeredQuestions = 0;
        let quizAnswers = {};
        let isStudyModeEnabled = localStorage.getItem('studyMode') === 'enabled';
        let revealedAnswerIndices = new Set();
        let isMissedReviewMode = new URLSearchParams(window.location.search).get('missed') === '1';
        
        // DOM elements
        const quizContainer = document.getElementById('quizContainer');
        const questionsContainer = document.getElementById('questionsContainer');
        const scoreElement = document.getElementById('score');
        const progressBar = document.getElementById('progressBar');
        const resultsSection = document.getElementById('resultsSection');
        const finalScoreElement = document.getElementById('finalScore');
        const resultsMessageElement = document.getElementById('resultsMessage');
        const restartBtn = document.getElementById('restartBtn');
        const viewAnswersBtn = document.getElementById('viewAnswersBtn');
        const takeNewTestBtn = document.getElementById('takeNewTestBtn');
        const themeToggle = document.getElementById('themeToggle');
        const studyModeToggle = document.getElementById('studyModeToggle');
        const missedCountElement = document.getElementById('missedCount');
        const quizTitle = document.getElementById('quizTitle');
        const totalQuestionsElement = document.getElementById('totalQuestions');
        const finalTotalQuestionsElement = document.getElementById('finalTotalQuestions');
        const stateSelect = document.getElementById('stateSelect');
        const columnsSelect = document.getElementById('columnsSelect');
        const subtitleText = document.getElementById('subtitleText');

        let allQuestions = [];
        const storedState = localStorage.getItem('selectedState');
        let selectedState = storedState !== null ? storedState : 'Rheinland-Pfalz';
        let columnCount = parseInt(localStorage.getItem('columnCount'), 10) || 1;

        function filterQuestionsByState(questionList, state) {
            if (!state) {
                return questionList;
            }
            return questionList.filter(question => !question.state || question.state === state);
        }

        function updateSubtitle() {
            subtitleText.textContent = selectedState
                ? `Übungstest für ${selectedState}`
                : 'Übungstest, alle Bundesländer';
        }

        function applyColumnLayout() {
            questionsContainer.classList.toggle('columns-2', columnCount === 2);
            document.body.classList.toggle('wide', columnCount === 2);
        }

        // Event listeners
        restartBtn.addEventListener('click', startNewTest);
        takeNewTestBtn.addEventListener('click', startNewTest);
        viewAnswersBtn.addEventListener('click', scrollToTop);
        themeToggle.addEventListener('change', toggleTheme);
        studyModeToggle.addEventListener('change', toggleStudyMode);
        stateSelect.addEventListener('change', (event) => {
            selectedState = event.target.value;
            localStorage.setItem('selectedState', selectedState);
            questions = filterQuestionsByState(allQuestions, selectedState);
            updateSubtitle();
            startNewTest();
        });
        columnsSelect.addEventListener('change', (event) => {
            columnCount = parseInt(event.target.value, 10);
            localStorage.setItem('columnCount', columnCount);
            applyColumnLayout();
        });

        stateSelect.value = selectedState;
        columnsSelect.value = String(columnCount);
        applyColumnLayout();
        updateSubtitle();

        // Check for saved theme preference
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.checked = true;
        }

        studyModeToggle.checked = isStudyModeEnabled;
        
        // Toggle theme function
        function toggleTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleStudyMode(event) {
            isStudyModeEnabled = event.target.checked;
            localStorage.setItem('studyMode', isStudyModeEnabled ? 'enabled' : 'disabled');
            updateStudyAnswerHighlights();
        }

        function updateStudyAnswerHighlights() {
            document.querySelectorAll('.options').forEach((optionsList) => {
                const firstOption = optionsList.querySelector('.option');
                if (!firstOption) {
                    return;
                }

                const questionIndex = Number(firstOption.dataset.questionIndex);
                StudyMode.applyStudyMode(
                    optionsList.querySelectorAll('.option'),
                    selectedQuestions[questionIndex].correctAnswer,
                    isAnswerVisible(questionIndex)
                );
            });

            document.querySelectorAll('.answer-toggle').forEach((button) => {
                button.disabled = isStudyModeEnabled;
            });
        }

        function isAnswerVisible(questionIndex) {
            return isStudyModeEnabled || revealedAnswerIndices.has(questionIndex);
        }

        function toggleAnswerReveal(event) {
            const button = event.currentTarget;
            const questionIndex = Number(button.dataset.questionIndex);

            if (revealedAnswerIndices.has(questionIndex)) {
                revealedAnswerIndices.delete(questionIndex);
                button.textContent = 'Show Answer';
            } else {
                revealedAnswerIndices.add(questionIndex);
                button.textContent = 'Hide Answer';
            }

            const options = document.querySelectorAll(`#question-${questionIndex} .option`);
            StudyMode.applyStudyMode(options, selectedQuestions[questionIndex].correctAnswer, isAnswerVisible(questionIndex));
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateMissedCount() {
            missedCountElement.textContent = MissedQuestions.getMissedQuestionCount();
        }

        function updateQuizTitle() {
            quizTitle.textContent = isMissedReviewMode
                ? `Missed Questions Review (${selectedQuestions.length})`
                : `${selectedQuestions.length} Random Questions`;
        }

        function saveQuizSession() {
            localStorage.setItem(QUIZ_SESSION_STORAGE_KEY, JSON.stringify({
                isMissedReviewMode,
                selectedQuestionIds: selectedQuestions.map(question => question.id),
                answers: quizAnswers,
                score,
                answeredCount: answeredQuestions
            }));
        }

        function loadQuizSession() {
            try {
                return JSON.parse(localStorage.getItem(QUIZ_SESSION_STORAGE_KEY));
            } catch (error) {
                return null;
            }
        }

        function clearQuizSession() {
            localStorage.removeItem(QUIZ_SESSION_STORAGE_KEY);
        }

        function startNewTest() {
            clearQuizSession();
            initializeQuiz();
        }

        // Initialize quiz
        function initializeQuiz() {
            // Reset quiz state
            score = 0;
            answeredQuestions = 0;
            selectedQuestions = [];
            quizAnswers = {};
            revealedAnswerIndices = new Set();

            // Hide results section and show quiz container
            resultsSection.style.display = 'none';
            quizContainer.style.display = 'block';

            // Update score display
            scoreElement.textContent = score;

            // Update progress bar
            updateProgressBar();

            // Select the questions for this test
            if (questions.length > 0) {
                selectRandomQuestions();
                updateQuizTitle();
                updateTotalQuestionsDisplay();

                if (selectedQuestions.length === 0) {
                    questionsContainer.innerHTML = '<p>No missed questions yet — nice work!</p>';
                    return;
                }

                displayQuestions();
                saveQuizSession();
            }
        }

        // Restore a previously saved, in-progress test
        function restoreQuizSession(session) {
            isMissedReviewMode = session.isMissedReviewMode;
            score = session.score;
            answeredQuestions = session.answeredCount;
            quizAnswers = session.answers || {};
            selectedQuestions = session.selectedQuestionIds
                .map(id => questions.find(question => question.id === id))
                .filter(Boolean);
            revealedAnswerIndices = new Set();

            resultsSection.style.display = 'none';
            quizContainer.style.display = 'block';

            scoreElement.textContent = score;
            finalScoreElement.textContent = score;
            updateQuizTitle();
            updateTotalQuestionsDisplay();
            updateProgressBar();
            displayQuestions();

            Object.entries(quizAnswers).forEach(([questionIndex, optionIndex]) => {
                applyAnsweredState(Number(questionIndex), optionIndex);
            });

            if (selectedQuestions.length > 0 && answeredQuestions === selectedQuestions.length) {
                showResults();
            }
        }

        function updateTotalQuestionsDisplay() {
            totalQuestionsElement.textContent = selectedQuestions.length;
            finalTotalQuestionsElement.textContent = selectedQuestions.length;
        }

        // Select questions for this test: a random 33 normally,
        // or every currently-missed question in review mode
        function selectRandomQuestions() {
            if (isMissedReviewMode) {
                const missedQuestionIds = new Set(MissedQuestions.getMissedQuestionIds());
                selectedQuestions = questions.filter(question => missedQuestionIds.has(question.id));
                return;
            }

            // Create a copy of all questions
            const allQuestions = [...questions];

            // Shuffle the array
            for (let i = allQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
            }

            // Take the first 33 or all if less than 33
            selectedQuestions = allQuestions.slice(0, Math.min(33, allQuestions.length));
        }
        
        // Display all selected questions
        function displayQuestions() {
            questionsContainer.innerHTML = '';
            
            selectedQuestions.forEach((question, index) => {
                // Create question container
                const questionContainer = document.createElement('div');
                questionContainer.classList.add('question-container');
                questionContainer.id = `question-${index}`;

                // Reference-number badge, like a field number on an official form
                const questionIdBadge = document.createElement('div');
                questionIdBadge.classList.add('question-id');
                questionIdBadge.textContent = String(question.id).padStart(3, '0');
                questionContainer.appendChild(questionIdBadge);

                const questionBody = document.createElement('div');
                questionBody.classList.add('question-body');

                // Create question text
                const questionElement = document.createElement('div');
                questionElement.classList.add('question');
                questionElement.textContent = question.question;

                questionBody.appendChild(questionElement);

                if (question.img) {
                    // Create question image
                    const questionImage = document.createElement('img');
                    questionImage.src = "imgs/" + question.img;
                    questionBody.appendChild(questionImage);
                }

                // Create translation toggle
                const translationToggle = document.createElement('button');
                translationToggle.classList.add('translation-toggle');
                translationToggle.textContent = 'Show Translation';
                translationToggle.dataset.questionId = index;
                translationToggle.addEventListener('click', toggleTranslation);
                questionBody.appendChild(translationToggle);

                // Create answer toggle
                const answerToggle = document.createElement('button');
                answerToggle.classList.add('answer-toggle');
                answerToggle.textContent = revealedAnswerIndices.has(index) ? 'Hide Answer' : 'Show Answer';
                answerToggle.dataset.questionIndex = index;
                answerToggle.disabled = isStudyModeEnabled;
                answerToggle.addEventListener('click', toggleAnswerReveal);
                questionBody.appendChild(answerToggle);

                // Create question translation
                const translationElement = document.createElement('div');
                translationElement.classList.add('translation');
                translationElement.id = `translation-${index}`;
                translationElement.textContent = question.question_trans;
                questionBody.appendChild(translationElement);

                // Create options
                const optionsList = document.createElement('ul');
                optionsList.classList.add('options');

                question.options.forEach((option, optionIndex) => {
                    const optionItem = document.createElement('li');
                    optionItem.classList.add('option');
                    optionItem.dataset.questionIndex = index;
                    optionItem.dataset.optionIndex = optionIndex;

                    // Ballot-style marker, filled in when this option is chosen
                    const optionMarker = document.createElement('span');
                    optionMarker.classList.add('option-marker');
                    optionItem.appendChild(optionMarker);

                    const optionMark = document.createElement('span');
                    optionMark.classList.add('option-mark');

                    // Create option text container
                    const optionText = document.createElement('span');
                    optionText.textContent = option;
                    optionMark.appendChild(optionText);

                    // Create option translation container
                    const optionTranslation = document.createElement('span');
                    optionTranslation.classList.add('option-translation');
                    optionTranslation.textContent = question.options_trans[optionIndex];
                    optionMark.appendChild(optionTranslation);

                    optionItem.appendChild(optionMark);

                    optionItem.addEventListener('click', selectOption);

                    optionsList.appendChild(optionItem);
                });

                questionBody.appendChild(optionsList);
                questionContainer.appendChild(questionBody);
                StudyMode.applyStudyMode(optionsList.querySelectorAll('.option'), question.correctAnswer, isAnswerVisible(index));
                questionsContainer.appendChild(questionContainer);
            });
        }
        
        // Apply the visual state for a question that has already been answered
        function applyAnsweredState(questionIndex, optionIndex) {
            const question = selectedQuestions[questionIndex];
            const optionsList = document.querySelector(`#question-${questionIndex} .options`);
            if (!question || !optionsList) {
                return;
            }

            const optionItem = optionsList.querySelector(`[data-option-index="${optionIndex}"]`);
            if (optionItem) {
                optionItem.classList.add('selected');
                optionItem.classList.add(optionIndex === question.correctAnswer - 1 ? 'correct' : 'incorrect');
            }

            const correctOption = optionsList.querySelector(`[data-option-index="${question.correctAnswer - 1}"]`);
            if (correctOption) {
                correctOption.classList.add('correct');
            }

            optionsList.querySelectorAll('.option').forEach(option => {
                option.removeEventListener('click', selectOption);
            });
        }

        // Select an option
        function selectOption(event) {
            const optionItem = event.currentTarget;
            const questionIndex = parseInt(optionItem.dataset.questionIndex);
            const optionIndex = parseInt(optionItem.dataset.optionIndex);
            const question = selectedQuestions[questionIndex];
            const isCorrect = optionIndex === question.correctAnswer - 1;

            applyAnsweredState(questionIndex, optionIndex);

            if (isCorrect) {
                score++;
                scoreElement.textContent = score;
                finalScoreElement.textContent = score;
            }

            MissedQuestions.recordAnswer(question.id, isCorrect);
            updateMissedCount();

            // Increment answered questions count
            answeredQuestions++;
            quizAnswers[questionIndex] = optionIndex;
            saveQuizSession();

            // Update progress bar
            updateProgressBar();

            // Check if all questions have been answered
            if (answeredQuestions === selectedQuestions.length) {
                showResults();
            }
        }
        
        // Toggle translation
        function toggleTranslation(event) {
            const button = event.currentTarget;
            const questionId = button.dataset.questionId;
            const translationElement = document.getElementById(`translation-${questionId}`);
            const optionTranslations = document.querySelectorAll(`.option[data-question-index="${questionId}"] .option-translation`);
            
            if (translationElement.classList.contains('visible')) {
                translationElement.classList.remove('visible');
                optionTranslations.forEach(trans => trans.classList.remove('visible'));
                button.textContent = 'Show Translation';
            } else {
                translationElement.classList.add('visible');
                optionTranslations.forEach(trans => trans.classList.add('visible'));
                button.textContent = 'Hide Translation';
            }
        }
        
        // Update progress bar
        function updateProgressBar() {
            const progressPercentage = (answeredQuestions / selectedQuestions.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }
        
        // Show results section
        function showResults() {
            const passPercentage = (score / selectedQuestions.length) * 100;
            let message = '';
            
            if (passPercentage >= 80) {
                message = 'Excellent! You have a great understanding of the subject.';
            } else if (passPercentage >= 60) {
                message = 'Good job! You have a solid understanding, but there\'s room for improvement.';
            } else {
                message = 'Keep practicing! You might need to review the material again.';
            }
            
            resultsMessageElement.textContent = message;
            resultsSection.style.display = 'block';
        }
        
        // Quiz class to handle loading questions from JSON file
        class Quiz {
            constructor(data) {
                this.questions = data.questions || [];
            }
            
            static async loadQuestions() {
                try {
                    const response = await fetch('dataset.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error loading questions:', error);
                    quizContainer.innerHTML = `
                        <div class="error">
                            <h2>Error loading questions</h2>
                            <p>Please make sure dataset.json is in the same directory as this HTML file.</p>
                            <p>Error details: ${error.message}</p>
                        </div>
                    `;
                    return { questions: [] };
                }
            }
        }
        
        // Load the quiz data on page load
        document.addEventListener('DOMContentLoaded', async function() {
            const data = await Quiz.loadQuestions();
            allQuestions = data.questions || [];
            questions = filterQuestionsByState(allQuestions, selectedState);
            updateMissedCount();

            if (questions.length > 0) {
                const savedSession = loadQuizSession();
                const canResumeSavedSession = savedSession
                    && savedSession.isMissedReviewMode === isMissedReviewMode
                    && savedSession.selectedQuestionIds.length > 0;

                if (canResumeSavedSession) {
                    restoreQuizSession(savedSession);
                } else {
                    initializeQuiz();
                }
            } else if (questions.length === 0 && !document.querySelector('.error')) {
                quizContainer.innerHTML = `
                    <div class="error">
                        <h2>No questions found</h2>
                        <p>The JSON file was loaded but no questions were found.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
